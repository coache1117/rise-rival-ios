# Rise Rival - Codemagic builds the iPhone app on its Mac and sends it to TestFlight.
# Nothing secret lives in this file. The Apple key is added inside Codemagic (Teams > Integrations),
# and is named here only by its label (the same key the RideFlow apps use): RideFlow App Store key
workflows:
  rise-rival-ios:
    name: Rise Rival - iPhone
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: RideFlow App Store key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.riserival.app
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Get the parts
        script: npm ci
      - name: Make the iPhone project
        script: bash scripts/ios-setup.sh
      - name: Use the signing files
        script: xcode-project use-profiles
      - name: Build the app
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
